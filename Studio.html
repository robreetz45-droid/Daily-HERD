*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased}
/* header */
.band{background:linear-gradient(120deg,var(--g900),var(--g700));color:#fff;padding:16px 22px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}
.mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--g300),#A9D7BE);display:grid;place-items:center;font-weight:800;color:var(--g900);font-size:15px;letter-spacing:-.5px}
.band h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.band .sub{font-size:11.5px;color:#BFE0CE;margin-top:1px}
.herd{margin-left:auto;font-size:10px;letter-spacing:1.6px;color:#A9D2BC;text-transform:uppercase;font-weight:700}
.wrap{max-width:940px;margin:0 auto;padding:24px 22px 60px}
/* viewer + tabs */
.viewer{font-size:21px;font-weight:800;letter-spacing:-.4px}
.tabs{display:flex;gap:6px;margin:14px 0 18px}
.tab{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 18px;font-size:13.5px;font-weight:700;color:var(--soft);cursor:pointer;transition:.12s}
.tab:hover{border-color:var(--g300)}
.tab.active{background:var(--g700);color:#fff;border-color:var(--g700);box-shadow:var(--shadow)}
/* dean chips */
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);font-weight:700;margin:0 0 9px}
.deans{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.deanchip{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:.12s}
.deanchip:hover{border-color:var(--g300);background:#FbFdFb}
.deanchip.active{background:var(--g100);border-color:var(--g500);color:var(--g700);font-weight:700}
/* search */
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--white);box-shadow:var(--shadow)}
.searchbar input:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.searchbar .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
.yearNote{display:none;background:linear-gradient(120deg,#F0F6F2,#FAFCFA);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-size:13.5px;color:var(--soft);margin-bottom:16px}
.hint{font-size:12.5px;color:var(--faint);margin:2px 2px 16px}
/* results */
.results{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.res-head{display:grid;grid-template-columns:2fr .6fr 1fr;gap:10px;padding:11px 18px;background:#F7FAF8;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700}
.res{display:grid;grid-template-columns:2fr .6fr 1fr;gap:10px;padding:13px 18px;border-top:1px solid var(--line2);cursor:pointer;align-items:center;transition:.1s}
.res:hover{background:#F6FBF8}
.res b{font-size:14px;font-weight:700}.res .s{font-size:12px;color:var(--soft);margin-top:1px}
.res .g{font-size:13px;color:var(--soft)}
.status{display:none}
.count{font-size:12px;color:var(--faint);margin:2px 2px 16px;font-weight:600}
/* high-priority list */
.priority{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--unexc);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.priority h4{margin:0;padding:12px 18px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--unexc);font-weight:800;background:#FCF2EE;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:1.7fr .5fr 1.1fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer;align-items:center;transition:.1s}
.prow:hover{background:#FEF8F6}
.prow b{font-size:14px;font-weight:700}.prow .s{font-size:12px;color:var(--soft);margin-top:1px}
.prow .g{font-size:13px;color:var(--soft)}
.prow .miss{text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.prow .missn{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
/* student dashboard */
.back{background:none;border:none;color:var(--g700);font-weight:700;font-size:13.5px;padding:4px 0;margin-bottom:6px;cursor:pointer}
.sd-name{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.sd-meta{font-size:13px;color:var(--soft);margin:4px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}
.card.full{grid-column:1 / -1}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);font-weight:700}
.lead{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.lead small{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;font-weight:600;color:var(--soft)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.lane{display:grid;grid-template-columns:70px 1fr 86px;gap:12px;align-items:center;margin-bottom:11px}
.lane:last-child{margin-bottom:0}
.plabel{font-size:12.5px;font-weight:700;color:var(--soft)}
.track{display:flex;height:24px;border-radius:7px;overflow:hidden;background:#EEF3EF;box-shadow:inset 0 0 0 1px var(--line)}
.seg{height:100%}
.cnt{font-size:12px;color:var(--soft);font-weight:600;text-align:right}
table.acc{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.acc th:first-child,.acc td:first-child{width:34%}
.acc th.n,.acc td.n{width:16.5%}
.acc th,.acc td{padding:9px 8px;text-align:left}
.acc th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;border-bottom:1px solid var(--line)}
.acc td{border-bottom:1px solid var(--line2)}
.acc td.n,.acc th.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.acc td.lbl{color:var(--soft);font-weight:600}
.acc tr.total td{border-top:2px solid var(--g500);border-bottom:none;font-weight:800;padding-top:11px;font-size:14px}
.acc tr.total td.lbl{color:var(--ink)}
.note{font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.55}
.help{background:linear-gradient(120deg,#F0F6F2,#FAFCFA);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:12.5px;color:var(--soft);margin-top:18px;line-height:1.6}
.help b{color:var(--ink)}
/* branding */
.brandright{margin-left:auto;display:flex;align-items:center;gap:12px}
.mvimg{height:34px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.watermarked{position:relative}
.watermarked::before{content:'';position:absolute;inset:0;background:var(--mustang) no-repeat center/min(58%,340px);opacity:.055;pointer-events:none;z-index:0}
.watermarked>*{position:relative;z-index:1}
/* full-area mustang silhouette behind the browse content, starting under the search bar */
#browse{position:relative}
#browse::before{content:'';position:absolute;left:0;right:0;top:60px;bottom:0;
background:var(--mustang) no-repeat center top/min(92%,860px);
opacity:.10;pointer-events:none;z-index:0;filter:grayscale(1)}
#browse>*{position:relative;z-index:1}
/* coordinator chips + queue */
.coordchip{background:var(--g900);border:1px solid var(--g900);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;transition:.12s}
.rtlchip{background:#2F6F95;color:#fff;border-color:#2F6F95}
.rtlchip:hover{background:#245A7C;border-color:#245A7C}
.rtlchip.active{background:#245A7C;color:#fff;border-color:#245A7C}
/* Return to Learn roster */
.rtl-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 18px 12px}
.rtl-date{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;font-family:var(--font);font-weight:600}
.rtl-tally{font-size:12px;color:var(--soft);font-weight:700;margin-left:auto}
.rtl-row{display:grid;grid-template-columns:1.7fr .4fr .8fr .7fr 1.5fr;gap:8px;padding:11px 18px;border-top:1px solid var(--line2);align-items:center}
.rtl-row.present{background:#F3FAF6}
.rtl-row.absent{background:#FDF4F3}
.rtl-mark{display:flex;gap:6px;justify-content:flex-end}
.mbtn{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;color:var(--soft)}
.mbtn:hover{border-color:var(--g300)}
.mbtn.on-p{background:var(--g500);border-color:var(--g500);color:#fff}
.mbtn.on-a{background:#B3261E;border-color:#B3261E;color:#fff}
.rtl-unmarked{font-size:11px;color:var(--faint);font-weight:700}
@media print{
 .band,.tabs,.deans,.searchbar,.rtl-mark,.dbtn,.mbtn,.rtl-bar .dbtn{display:none !important}
 .queue{border:none;box-shadow:none}
 .scrollbox{max-height:none;overflow:visible}
 body{background:#fff}
}
.truancychip{background:#B3261E;color:#fff;border-color:#B3261E}
.truancychip:hover{background:#8F1D17;border-color:#8F1D17}
.truancychip.active{background:#8F1D17;color:#fff;border-color:#8F1D17}
.scrollbox{max-height:560px;overflow-y:auto;overflow-x:hidden}
.scrollbox::-webkit-scrollbar{width:10px}
.scrollbox::-webkit-scrollbar-thumb{background:#C4CFC8;border-radius:6px}
.scrollbox::-webkit-scrollbar-thumb:hover{background:#A9B7AE}
.coordchip:hover{background:var(--g700)}
.coordchip.active{background:var(--g500);border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.chipdiv{width:1px;background:var(--line);margin:3px 4px;align-self:stretch}
.queue{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--g700);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.queue h4{margin:0;padding:13px 18px 4px;font-size:15px;font-weight:800;color:var(--g900)}
.queue .qsub{padding:0 18px 12px;font-size:12px;color:var(--soft);border-bottom:1px solid var(--line);line-height:1.55}
.q-head{display:grid;grid-template-columns:1.6fr .4fr .8fr .5fr .5fr .5fr 1.5fr;gap:8px;padding:10px 18px;background:#F7FAF8;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700}
.qrow{display:grid;grid-template-columns:1.6fr .4fr .8fr .5fr .5fr .5fr 1.5fr;gap:8px;padding:12px 18px;border-top:1px solid var(--line2);align-items:center}
.qrow .nm{cursor:pointer}
.qrow .nm b{font-size:14px;font-weight:700}
.qrow .nm .s{font-size:11.5px;color:var(--soft);margin-top:1px}
.qrow .g{font-size:13px;color:var(--soft)}
.qrow .num{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.qrow .num small{font-weight:600;color:var(--faint);font-size:10.5px;display:block}
.newpill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff;background:var(--unexc);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.qbtns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.qbtns.qbtns-esc{flex-wrap:nowrap;justify-content:flex-end}
.qbtns.qbtns-esc .dbtn{padding:8px 10px;white-space:nowrap}
.dbtn{border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;color:#fff;background:var(--g700);transition:.12s}
.dbtn:hover{background:var(--g900)}
.dbtn.wed{background:var(--parent)}
.dbtn.wed:hover{background:#245A7C}
.dbtn:disabled{background:#C4CFC8;cursor:default}
.qempty{padding:20px 18px;font-size:13px;color:var(--soft)}
.qdone{font-size:12px;color:var(--g700);font-weight:700;text-align:right}
/* accountability card */
.owe{background:#FBE7E5;color:var(--warn);font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;display:inline-block;margin-left:8px}
.assignlist{font-size:12px;color:var(--soft);margin-top:10px;line-height:1.6}
/* contact log */
.clog-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.clog-sel{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--white);color:var(--ink);font-family:var(--font);font-weight:600}
.clog-sel:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.clog-note{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;background:var(--white);font-family:var(--font)}
.clog-note:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.clog-list{margin-top:4px}
.clog-empty{font-size:13px;color:var(--soft);padding:6px 0}
.clog-item{border-top:1px solid var(--line2);padding:11px 0}
.clog-item:first-child{border-top:none}
.clog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.clog-mo{font-size:13.5px;color:var(--ink)}
.clog-meta{font-size:11.5px;color:var(--faint);font-weight:600;white-space:nowrap}
.clog-notetext{font-size:12.5px;color:var(--soft);margin-top:4px;line-height:1.5}
</style>
</head>

<script>
var MODE = "<?!= MODE ?>";
var YEAR = "<?!= YEAR ?>";
var AVG_CLASSES = <?!= AVG_CLASSES ?>;
var STUDENT = <?!= STUDENT_JSON ?>;
var VIEWER_DEANS = <?!= VIEWER_DEANS ?>;
var YEARS_WITH_DATA = <?!= YEARS_WITH_DATA ?>;
var DEAN_NAMES = <?!= DEAN_NAMES ?>;
// True only for admins and coordinators — deans do not see the coordinator/truancy chips.
var IS_COORD_VIEW = (<?!= IS_COORD_VIEW ?>);
// Parent Outreach Coordinator tabs (26-27 only). Keep in sync with CONFIG.COORDINATORS.
var COORD_NAMES = ['Odom','Desjarlait'];
// Contact-log vocabularies — keep in sync with Contacts.gs CONTACT_METHODS_/CONTACT_OUTCOMES_
var CONTACT_METHODS  = ['Phone','Email','Text','In-person','Letter','Home visit'];
var CONTACT_OUTCOMES = ['Reached','Left message','No answer','Meeting scheduled','No valid contact info'];
var activeYear = YEAR;
var activeDean = null;
var activeCoord = null;
var activeTruancy = false;
var activeSession = false;   // Return to Learn roster / follow-up view








function chip(){return '';} // status labels removed by request
function hasData(y){return YEARS_WITH_DATA.indexOf(y)>=0;}








function renderDeanChips(){
var box=document.getElementById('deans');
var html=DEAN_NAMES.map(function(d){
var cls='deanchip'+(d===activeDean?' active':'');
return '<button class="'+cls+'" onclick="selectDean(\''+d+'\')">'+d+'</button>';
}).join('');
if(IS_COORD_VIEW && (activeYear==='2627' || activeYear==='2526')){
html+='<div class="chipdiv"></div>'+COORD_NAMES.map(function(c){
var cls='coordchip'+(c===activeCoord?' active':'');
return '<button class="'+cls+'" onclick="selectCoordinator(\''+c+'\')">'+c+'</button>';
}).join('');
html+='<button class="coordchip rtlchip'+(activeSession?' active':'')+'" onclick="openSession()">Return to Learn</button>';
html+='<button class="coordchip truancychip'+(activeTruancy?' active':'')+'" onclick="openTruancy()">Ramsey County Truancy</button>';
}
box.innerHTML=html;
}








/* ===== Return to Learn \u2014 session roster + follow-up ===== */
var sessionDate = '';

function openSession(){
activeSession=true;activeTruancy=false;activeCoord=null;activeDean=null;
renderDeanChips();
document.getElementById('q').value='';
document.getElementById('student').innerHTML='';
document.getElementById('browse').style.display='';
document.getElementById('yearNote').style.display='none';
document.getElementById('hint').textContent='';
hidePriority();paintResults([]);
var box=document.getElementById('coordQueue');
box.style.display='block';
box.innerHTML='<div class="queue"><div class="qempty">Loading\u2026</div></div>';
if(sessionDate){loadSession();return;}
google.script.run.withSuccessHandler(function(d){sessionDate=d;loadSession();})
.withFailureHandler(function(e){box.innerHTML='<div class="queue"><div class="qempty">Could not load: '+e.message+'</div></div>';})
.nextSessionDate(activeYear,AuthGate.token(activeYear));
}

function changeSessionDate(v){ sessionDate=v; loadSession(); }

function loadSession(){
google.script.run.withSuccessHandler(function(r){
google.script.run.withSuccessHandler(function(f){renderSession(r,f);})
.withFailureHandler(function(){renderSession(r,[]);})
.followUpList(activeYear,AuthGate.token(activeYear));
}).withFailureHandler(function(e){
document.getElementById('coordQueue').innerHTML='<div class="queue"><div class="qempty">Could not load roster: '+e.message+'</div></div>';
}).sessionRoster(activeYear,sessionDate,AuthGate.token(activeYear));
}

function renderSession(r,follow){
if(!activeSession)return;
var box=document.getElementById('coordQueue');
var c=r.counts||{};
var head='<h4>Return to Learn \u2014 session roster</h4>'+
'<div class="qsub">Mark each student present or absent. Anyone left unmarked is not counted as a no-show, so you can tell \u201cdid not attend\u201d from \u201cattendance was not taken.\u201d '+
'Absences appear on the follow-up list below the next morning.</div>'+
'<div class="rtl-bar">'+
'<label style="font-size:12px;font-weight:700;color:var(--soft)">Session date</label>'+
'<input type="date" class="rtl-date" value="'+esc(r.date||'')+'" onchange="changeSessionDate(this.value)">'+
'<button class="dbtn" onclick="markAllPresent()">Mark all present</button>'+
'<button class="dbtn" style="background:var(--parent)" onclick="window.print()">Print roster</button>'+
'<span class="rtl-tally">'+(c.total||0)+' assigned \u00b7 '+(c.present||0)+' present \u00b7 '+(c.absent||0)+' absent \u00b7 '+(c.unmarked||0)+' unmarked</span>'+
'</div>';

var rows='';
if(!r.rows||!r.rows.length){
rows='<div class="qempty">No students assigned to Return to Learn on this date.</div>';
}else{
rows='<div class="scrollbox">'+r.rows.map(function(s){
var cls=s.attendance==='present'?' present':(s.attendance==='absent'?' absent':'');
var tag=s.infraction==='tardy'?'tardies':'unexcused';
return '<div class="rtl-row'+cls+'" id="rtl_'+s.rowIndex+'">'+
'<div class="nm" onclick="open_(\''+s.id+'\')"><b>'+esc(s.name)+'</b>'+
'<div class="s">ID '+esc(s.id)+' \u00b7 '+tag+'</div></div>'+
'<div class="g">Gr '+esc(String(s.grade))+'</div>'+
'<div class="g">'+esc(s.dean)+'</div>'+
'<div class="rtl-unmarked">'+(s.attendance?esc(s.attendance):'unmarked')+'</div>'+
'<div class="rtl-mark">'+
'<button class="mbtn'+(s.attendance==='present'?' on-p':'')+'" onclick="markAttendance('+s.rowIndex+',\'present\')">Present</button>'+
'<button class="mbtn'+(s.attendance==='absent'?' on-a':'')+'" onclick="markAttendance('+s.rowIndex+',\'absent\')">Absent</button>'+
'</div></div>';
}).join('')+'</div>';
}

var fu='';
if(follow&&follow.length){
fu='<div style="padding:14px 18px 4px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#B3261E;text-transform:uppercase">Follow-up \u2014 did not attend</div>'+

function loadAccountability(id){
google.script.run.withSuccessHandler(function(a){
var el=document.getElementById('acctBody');
if(!el)return;
if(!a.tracked && !a.tardyAssigned && !a.unexcAssigned){
el.innerHTML='Daily tardy and unexcused tracking begins with the 2026\u201327 school year. No accountability data for this student yet.';
return;
}
var escTag=a.escalated?'<span class="owe" style="background:#FBE7E5;color:#B3261E">Escalation \u2014 9+ unexcused</span>':'';
var oweTag=a.unexcOwed>0?'<span class="owe">'+a.unexcOwed+' unexcused Return to Learn not yet assigned</span>':'';
var tardyTag=(a.tardyWeek>=a.tardyLine)?'<span class="owe" style="background:#FBF3D0;color:#8A6D00">Return to Learn due this week</span>':'';
 
var tbl='<table class="acc">'+
'<tr><th class="lbl">Measure</th><th class="n">Count</th></tr>'+
'<tr><td class="lbl">Tardies (this week)</td><td class="n">'+a.tardyWeek+'</td></tr>'+
'<tr><td class="lbl">Unexcused (year to date)</td><td class="n">'+a.unexc+'</td></tr>'+
'<tr><td class="lbl">Tardy Return to Learn assigned</td><td class="n">'+a.tardyAssigned+'</td></tr>'+
'<tr class="total"><td class="lbl">Unexcused Return to Learn assigned</td><td class="n">'+a.unexcAssigned+'</td></tr>'+
'</table>';
 
var det=(a.assignments&&a.assignments.length)?
'<div class="assignlist"><b>Assigned:</b> '+a.assignments.map(function(x){return (x.infraction==='tardy'?'\u25CB ':'\u25CF ')+x.day+' '+x.date;}).join(' \u00b7 ')+'</div>':'';
 
var expl='<div class="note">Two separate rules: <b>5 tardies in a week</b> = one Return to Learn (resets weekly); '+
'<b>every 3rd unexcused absence</b> (year to date) = one Return to Learn. At 9 unexcused, the case escalates to the AP and Dean. '+
tardyTag+' '+oweTag+' '+escTag+'</div>';
 
el.innerHTML=tbl+det+expl;
}).withFailureHandler(function(){
var el=document.getElementById('acctBody');
if(el)el.textContent='Accountability data unavailable right now.';
}).getAccountability(activeYear,String(id),AuthGate.token(activeYear));
}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}








function fillContactSelects(){
var m=document.getElementById('cMethod'),o=document.getElementById('cOutcome');
if(m&&!m.options.length){m.innerHTML=CONTACT_METHODS.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');}
if(o&&!o.options.length){o.innerHTML=CONTACT_OUTCOMES.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');}
}








function loadContacts(id){
google.script.run.withSuccessHandler(renderContacts)
.withFailureHandler(function(){var el=document.getElementById('contactBody');if(el)el.textContent='Outreach log unavailable right now.';})
.getContacts(activeYear,String(id),AuthGate.token(activeYear));
}








function renderContacts(list){
var el=document.getElementById('contactBody');
if(!el)return;
if(!list||!list.length){el.innerHTML='<div class="clog-empty">No outreach logged yet for this student.</div>';return;}
el.innerHTML=list.map(function(c){
var yr=(c.year==='2526'?'25-26':(c.year==='2627'?'26-27':c.year));
var meta=[c.when,yr,c.by].filter(Boolean).join(' \u00b7 ');
return '<div class="clog-item">'+
'<div class="clog-top"><span class="clog-mo"><b>'+esc(c.method)+'</b>'+(c.outcome?' \u2014 '+esc(c.outcome):'')+'</span>'+
'<span class="clog-meta">'+esc(meta)+'</span></div>'+
(c.note?'<div class="clog-notetext">'+esc(c.note)+'</div>':'')+
'</div>';
}).join('');
}








function saveContact(){
var s=STUDENT;if(!s)return;
var method=document.getElementById('cMethod').value;
var outcome=document.getElementById('cOutcome').value;
var note=document.getElementById('cNote').value;
var btn=document.getElementById('cSave');var prev=btn.textContent;
btn.disabled=true;btn.textContent='Logging\u2026';
google.script.run.withSuccessHandler(function(res){
btn.disabled=false;btn.textContent=prev;
if(res&&res.ok){document.getElementById('cNote').value='';renderContacts(res.contacts);}
else{alert('Could not log contact: '+((res&&res.error)||'unknown error'));}
}).withFailureHandler(function(e){
btn.disabled=false;btn.textContent=prev;
alert('Could not log contact: '+e.message);
}).staffLogContact({year:activeYear,id:String(s.id),method:method,outcome:outcome,note:note},AuthGate.token(activeYear));
}








// init — runs AFTER the passcode gate is ready (called at the bottom of this file)

var tabs=document.querySelectorAll('.tab');
for(var i=0;i<tabs.length;i++){tabs[i].className=(tabs[i].getAttribute('data-yr')===activeYear)?'tab active':'tab';}
renderDeanChips();
AuthGate.ensure(activeYear, function (token) {
if(STUDENT){document.getElementById('browse').style.display='none';render();}
else if(!hasData(activeYear)){showYearNote();}
else if(VIEWER_DEANS&&VIEWER_DEANS.length===1){selectDean(VIEWER_DEANS[0]);}
else{showPickHint();}

} else { render(); }
}

<style>
  #mvLock {
    position: fixed; inset: 0; z-index: 99999;
    display: none; align-items: center; justify-content: center;
    background: rgba(12, 12, 14, 0.92);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; text-align: center;
  }
  #mvLock.show { display: flex; }
  .mvLock-inner { width: 228px; max-width: 86vw; }
  .mvLock-crest {
    font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
    color: #c9a24b; margin-bottom: 4px;
  }
  .mvLock-title { font-size: 15.5px; font-weight: 600; margin: 0 0 3px; }
  .mvLock-sub { font-size: 11px; color: rgba(255,255,255,0.65); margin: 0 0 18px; min-height: 14px; }




  .mvLock-dots { display: flex; justify-content: center; gap: 13px; margin-bottom: 23px; }
  .mvLock-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.85); transition: background 0.12s;
  }
  .mvLock-dot.on { background: #fff; }
  .mvLock-dots.shake { animation: mvShake 0.4s; }
  .mvLock-pad {
    display: grid; grid-template-columns: repeat(3, 57px);
    gap: 11px; justify-content: center;
  }
  .mvLock-key {
    width: 57px; height: 57px; border-radius: 50%;
    background: rgba(255,255,255,0.10); border: none; color: #fff;
    font-size: 21px; font-weight: 400; cursor: pointer;
    transition: background 0.1s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .mvLock-key:active { background: rgba(255,255,255,0.32); }
  .mvLock-key.ghost { background: transparent; font-size: 12px; }
  .mvLock-key.ghost:active { background: rgba(255,255,255,0.12); }




  .mvLock-msg { margin-top: 16px; font-size: 11.5px; color: #ff7a7a; min-height: 15px; }
  @media (prefers-reduced-motion: reduce) { .mvLock-dots.shake { animation: none; } }
</style>




<div id="mvLock" role="dialog" aria-modal="true" aria-label="Enter passcode">
  <div class="mvLock-inner">
    <div class="mvLock-crest">Mounds View High School</div>
    <h2 class="mvLock-title" id="mvLockTitle">Enter Passcode</h2>
    <p class="mvLock-sub" id="mvLockSub"></p>
    <div class="mvLock-dots" id="mvLockDots">
      <span class="mvLock-dot"></span><span class="mvLock-dot"></span>
      <span class="mvLock-dot"></span><span class="mvLock-dot"></span>
      <span class="mvLock-dot"></span><span class="mvLock-dot"></span>
    </div>
    <div class="mvLock-pad" id="mvLockPad"></div>
    <div class="mvLock-msg" id="mvLockMsg"></div>
  </div>
</div>




<script>
var AuthGate = (function () {
  // Tokens live only in memory: a refresh re-locks the screen,
  // exactly like an iPhone after it sleeps.
  var tokens = {};          // { '2627': 'abc...' }
  var state = null;         // current unlock flow




  var el = {
    root:  document.getElementById('mvLock'),
    title: document.getElementById('mvLockTitle'),
    sub:   document.getElementById('mvLockSub'),
    dots:  document.getElementById('mvLockDots'),
    pad:   document.getElementById('mvLockPad'),
    msg:   document.getElementById('mvLockMsg')
  };




  // Build the keypad: 1-9, blank, 0, delete.
  ['1','2','3','4','5','6','7','8','9','','0','\u232B'].forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mvLock-key' + (k === '' || k === '\u232B' ? ' ghost' : '');
    b.textContent = k;
    if (k === '') b.disabled = true;
    b.onclick = function () { k === '\u232B' ? backspace() : press(k); };
    el.pad.appendChild(b);
  });




  function paintDots(n) {
    var dots = el.dots.children;
    for (var i = 0; i < 6; i++) dots[i].classList.toggle('on', i < n);
  }
  function resetEntry() { state.entry = ''; paintDots(0); }
  function shake() {
    el.dots.classList.remove('shake');
    void el.dots.offsetWidth;
    el.dots.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate(60);
  }




  function press(d) {
    if (!state || state.busy || state.entry.length >= 6) return;
    state.entry += d;
    paintDots(state.entry.length);
    if (state.entry.length === 6) submit();
  }
  function backspace() {
    if (!state || state.busy || !state.entry) return;
    state.entry = state.entry.slice(0, -1);
    paintDots(state.entry.length);
    el.msg.textContent = '';
  }




  function submit() {
    state.busy = true;
    if (state.mode === 'verify')       verifyPin(state.entry);
    else if (state.mode === 'newpin')  { state.pending = state.entry; toNewConfirm(); }
    else if (state.mode === 'confirm') confirmNewPin(state.entry);
  }




  // ---- Step 1: verify against the server ----
  function verifyPin(pin) {
    google.script.run
      .withSuccessHandler(function (r) {
        state.busy = false;
        if (r.ok) {
          tokens[state.year] = r.token;
          if (r.mustChange) { toNewPin(); }
          else { finish(r.token); }
        } else if (r.lockedUntil) {
          resetEntry();
          lockCountdown(r.lockedUntil);
        } else {
          resetEntry(); shake();
          el.msg.textContent = r.remaining != null
            ? 'Wrong passcode \u2014 ' + r.remaining + ' tries left'
            : 'Wrong passcode. Try again.';
        }
      })
      .withFailureHandler(function () {
        state.busy = false; resetEntry(); shake();
        el.msg.textContent = 'Connection problem. Try again.';
      })
      .authVerifyPin(pin, state.year);
  }




  // ---- Steps 2 & 3: forced passcode change ----
  function toNewPin() {
    state.mode = 'newpin'; resetEntry();
    el.title.textContent = 'Set a New Passcode';
    el.sub.textContent = 'Choose 6 digits only you know.';
    el.msg.textContent = '';
  }
  function toNewConfirm() {
    state.mode = 'confirm'; state.busy = false; resetEntry();
    el.title.textContent = 'Re-enter New Passcode';
    el.sub.textContent = '';
  }
  function confirmNewPin(pin) {
    if (pin !== state.pending) {
      state.busy = false; shake(); toNewPin();
      el.msg.textContent = "Those didn't match. Start over.";
      return;
    }
    google.script.run
      .withSuccessHandler(function (r) {
        state.busy = false;
        if (r.ok) { finish(tokens[state.year]); }
        else { shake(); toNewPin(); el.msg.textContent = r.error || 'Try a different passcode.'; }
      })
      .withFailureHandler(function () {
        state.busy = false; shake(); toNewPin();
        el.msg.textContent = 'Connection problem. Try again.';
      })
      .authChangePin(tokens[state.year], pin);
  }




  function lockCountdown(until) {
    var tick = function () {
      var s = Math.max(0, Math.ceil((until - Date.now()) / 1000));
      if (s <= 0) { el.msg.textContent = ''; return; }
      var m = Math.floor(s / 60), r = s % 60;
      el.msg.textContent = 'Too many tries. Wait ' + m + ':' + (r < 10 ? '0' : '') + r;
      setTimeout(tick, 1000);
    };
    tick();
  }




  function finish(token) {
    el.root.classList.remove('show');
    var cb = state.onUnlocked; state = null;
    if (cb) cb(token);
  }




  // ---------------- public API ----------------
  return {
    /**
     * Gate a year tab. Calls onUnlocked(tokenOrNull) once the user
     * either isn't gated or has entered a valid passcode.
     */
    ensure: function (year, onUnlocked) {
      if (tokens[year]) { onUnlocked(tokens[year]); return; }
      google.script.run
        .withSuccessHandler(function (st) {
          if (!st.required) { onUnlocked(null); return; }
          state = { year: year, mode: 'verify', entry: '', busy: false,
                    onUnlocked: onUnlocked };
          el.title.textContent = 'Enter Passcode';
          el.sub.textContent = (year === '2526' ? '2025\u201326' : '2026\u201327') +
            ' student data is protected';
          el.msg.textContent = '';
          resetEntry();
          el.root.classList.add('show');
          if (st.lockedUntil) lockCountdown(st.lockedUntil);
        })
        .withFailureHandler(function () { onUnlocked(null); })
        .authGetState(year);
    },




    /** Current token for a year (null if locked). */
    token: function (year) { return tokens[year] || null; },




    /** If a server call throws AUTH_REQUIRED, call this to re-lock. */
    relock: function (year, onUnlocked) {
      delete tokens[year];
      AuthGate.ensure(year, onUnlocked);
    }
  };
})();




// Start the app now that the gate exists.
initApp();
</script>
</body>
